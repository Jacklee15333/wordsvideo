<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565C64"/><stop offset=".1" stop-color="#3B4047"/><stop offset=".6" stop-color="#2A2E33"/><stop offset="1" stop-color="#181A1E"/>
    </linearGradient>
    <linearGradient id="hump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A7179"/><stop offset=".35" stop-color="#454B53"/><stop offset="1" stop-color="#2C3036"/>
    </linearGradient>
    <pattern id="leather" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#24272C"/><circle cx="1.8" cy="1.8" r="1.1" fill="#2E3238"/><circle cx="5.2" cy="5.2" r="1.1" fill="#1B1D21"/>
    </pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/><stop offset=".5" stop-color="#C3C9CF"/><stop offset="1" stop-color="#868E97"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5ADB6"/><stop offset=".45" stop-color="#4A5058"/><stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <radialGradient id="glass" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#4C5F99"/><stop offset=".3" stop-color="#1F2850"/><stop offset=".75" stop-color="#080A12"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="coat" cx=".62" cy=".7" r=".5">
      <stop offset="0" stop-color="#7B4FD0" stop-opacity=".55"/><stop offset="1" stop-color="#7B4FD0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#DCE7F2"/><stop offset="1" stop-color="#AFC2D6"/>
    </linearGradient>
  </defs>
  <!-- 取景器的“驼峰” -->
  <path d="M200 116 L228 54 Q233 44 245 44 L355 44 Q367 44 372 54 L400 116 Z" fill="url(#hump)"/>
  <path d="M236 58 L364 58" stroke="#8A919A" stroke-width="3" opacity=".5"/>
  <!-- 左边模式转盘、右边快门 -->
  <rect x="92" y="88" width="78" height="30" rx="7" fill="url(#silver)"/>
  <g stroke="#7C848C" stroke-width="2">
    <line x1="100" y1="92" x2="100" y2="114"/><line x1="110" y1="92" x2="110" y2="114"/><line x1="120" y1="92" x2="120" y2="114"/><line x1="130" y1="92" x2="130" y2="114"/>
    <line x1="140" y1="92" x2="140" y2="114"/><line x1="150" y1="92" x2="150" y2="114"/><line x1="160" y1="92" x2="160" y2="114"/>
  </g>
  <rect x="438" y="96" width="76" height="22" rx="7" fill="#3A3F46"/>
  <ellipse cx="476" cy="94" rx="26" ry="9" fill="url(#silver)"/>
  <ellipse cx="476" cy="91" rx="18" ry="5" fill="#FFFFFF" opacity=".55"/>
  <!-- 机身 -->
  <rect x="38" y="112" width="524" height="262" rx="40" fill="url(#body)"/>
  <rect x="58" y="117" width="484" height="7" rx="3.5" fill="#FFFFFF" opacity=".14"/>
  <!-- 皮纹 -->
  <rect x="50" y="170" width="500" height="186" rx="16" fill="url(#leather)"/>
  <!-- 右手握把 -->
  <path d="M462 128 Q548 128 556 210 L556 330 Q556 368 518 370 L462 370 Z" fill="#141619" opacity=".75"/>
  <path d="M470 140 Q536 142 544 206" stroke="#FFFFFF" stroke-width="4" fill="none" opacity=".08"/>
  <!-- 闪光灯窗口 -->
  <rect x="74" y="128" width="84" height="32" rx="7" fill="#0F1114"/>
  <rect x="79" y="132" width="74" height="24" rx="5" fill="url(#flash)"/>
  <g stroke="#FFFFFF" stroke-width="1.5" opacity=".6"><line x1="86" y1="136" x2="86" y2="152"/><line x1="96" y1="136" x2="96" y2="152"/><line x1="106" y1="136" x2="106" y2="152"/><line x1="116" y1="136" x2="116" y2="152"/><line x1="126" y1="136" x2="126" y2="152"/><line x1="136" y1="136" x2="136" y2="152"/><line x1="146" y1="136" x2="146" y2="152"/></g>
  <!-- 背带扣 -->
  <rect x="26" y="142" width="16" height="34" rx="5" fill="url(#silver)"/><rect x="558" y="142" width="16" height="34" rx="5" fill="url(#silver)"/>
  <!-- 镜头 -->
  <circle cx="300" cy="248" r="136" fill="#0C0D10"/>
  <circle cx="300" cy="248" r="129" fill="url(#ring)"/>
  <circle cx="300" cy="248" r="113" fill="#1A1D21"/>
  <circle cx="300" cy="248" r="106" fill="none" stroke="#30353B" stroke-width="12" stroke-dasharray="3.2 3.2"/>
  <circle cx="300" cy="248" r="96" fill="#0B0C0F"/>
  <circle cx="300" cy="248" r="92" fill="none" stroke="#C9CFD5" stroke-width="2" opacity=".35"/>
  <circle cx="300" cy="248" r="86" fill="url(#glass)"/>
  <circle cx="300" cy="248" r="86" fill="url(#coat)"/>
  <circle cx="300" cy="248" r="64" fill="none" stroke="#3A4C8C" stroke-width="3" opacity=".6"/>
  <circle cx="300" cy="248" r="40" fill="#04050A"/>
  <circle cx="300" cy="248" r="40" fill="none" stroke="#4A5EA6" stroke-width="2" opacity=".55"/>
  <ellipse cx="264" cy="212" rx="38" ry="20" fill="#FFFFFF" opacity=".5" transform="rotate(-32 264 212)"/>
  <circle cx="281" cy="227" r="7" fill="#FFFFFF" opacity=".85"/>
  <ellipse cx="334" cy="286" rx="14" ry="7" fill="#A9C2FF" opacity=".45" transform="rotate(-30 334 286)"/>
</svg>
