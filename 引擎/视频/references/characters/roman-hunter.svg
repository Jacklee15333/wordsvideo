<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 440">
<defs>
 <linearGradient id="tun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D24E3F"/><stop offset="1" stop-color="#94291F"/></linearGradient>
 <linearGradient id="clk" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83302A"/><stop offset="1" stop-color="#4E1512"/></linearGradient>
 <radialGradient id="skin" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#F4C7A1"/><stop offset="1" stop-color="#D99C6E"/></radialGradient>
