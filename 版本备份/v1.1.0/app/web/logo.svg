<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3A63"/><stop offset="1" stop-color="#1A2440"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- 英语四线三格 -->
  <g stroke="#9EC2D6" stroke-width="1.1" opacity=".6">
    <line x1="9" y1="15" x2="55" y2="15"/><line x1="9" y1="25" x2="55" y2="25"/>
  </g>
  <line x1="9" y1="36" x2="55" y2="36" stroke="#E07A6E" stroke-width="1.6"/>
  <!-- 单词 w 写在中间一格，站在红线上 -->
  <path d="M16.5 24.5 L23.5 35.6 L31.5 25.5 L39.5 35.6 L46.5 24.5" fill="none" stroke="#FFFFFF" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 红线下面长出词根 -->
  <g fill="none" stroke="#E9B44C" stroke-width="1.7" stroke-linecap="round">
    <path d="M23.5 36.5 C23 41 20 43.5 16.5 46"/>
    <path d="M23.5 36.5 C24.5 41.5 26.5 45 26 50"/>
    <path d="M39.5 36.5 C40 41 43.5 43.5 47 45.5"/>
    <path d="M39.5 36.5 C38.5 41.5 36.5 45.5 37.5 50.5"/>
    <path d="M20 43.6 C18.8 46 18.6 48 19.3 50" stroke-width="1.4"/>
    <path d="M26 45 C27.8 46.5 29 47 30.5 47" stroke-width="1.2"/>
    <path d="M37.2 45.5 C35.5 46.8 34.2 47.3 33 47.4" stroke-width="1.2"/>
    <path d="M43.4 43.6 C45 46.2 45.2 48.2 44.6 50.4" stroke-width="1.4"/>
  </g>
  <line x1="9" y1="46" x2="55" y2="46" stroke="#9EC2D6" stroke-width="1.1" opacity=".35"/>
  <!-- 右上角一片新叶：资料加工、长出新东西 -->
  <path d="M47.5 15.5 C51 11 55.5 11 56.5 11.5 C56 14.5 52.5 17.5 47.5 15.5 Z" fill="#7CC4A0"/>
</svg>
